# Production stack for one Docker host (e.g. a small VPS):
#   cp deploy/.env.example deploy/.env   # fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Caddy obtains HTTPS certificates automatically for SITE_DOMAIN and API_DOMAIN (both DNS A records must
# point at this host, ports 80/443 open). Postgres and MinIO are not exposed to the internet.
name: forever

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forever
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../Forever-API
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/forever
      DB_USERNAME: forever
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (do not use the dev default)}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      # Image URLs must use the public API host even when the SSR server calls the API internally (api:8989).
      PUBLIC_API_URL: https://${API_DOMAIN}
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      OTP_LOG_CODE: "false"
      KHQR_ACCOUNT_ID: ${KHQR_ACCOUNT_ID:-}
      KHQR_MERCHANT_NAME: ${KHQR_MERCHANT_NAME:-Forever}
      KHQR_MERCHANT_CITY: ${KHQR_MERCHANT_CITY:-Phnom Penh}
      KHQR_API_TOKEN: ${KHQR_API_TOKEN:-}

  web:
    build:
      context: ../Forever-ReactJS
      args:
        VITE_API_URL: https://${API_DOMAIN:?set API_DOMAIN}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      SSR_API_URL: http://api:8989
      PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api]

volumes:
  postgres-data:
  minio-data:
  caddy-data:
