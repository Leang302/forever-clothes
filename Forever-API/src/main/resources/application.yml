server:
  port: 8989
  forward-headers-strategy: framework

spring:
  application:
    name: Forever-API
  config:
    import: optional:file:./.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forever}
    username: ${DB_USERNAME:forever}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET}            # base64, at least 32 bytes
    access-token-ttl: 30m
    refresh-token-ttl: 30d
  otp:
    length: 6
    ttl: 10m
    max-attempts: 5
    resend-cooldown: 60s
    log-code: ${OTP_LOG_CODE:false}  # dev only: print OTP codes to the application log
  login:
    max-failures: 5
    window: 15m
    lockout: 15m
  mail:
    from: ${MAIL_FROM:no-reply@forever.local}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:forever}
  shop:
    currency: USD
    delivery-fee: 10
  seed:
    enabled: true
    admin-email: ${ADMIN_EMAIL:admin@forever.com}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
  cors:
    allowed-origin-patterns: "*"
  payway:
    merchant-id: ${PAYWAY_MERCHANT_ID:ec479432}
    api-key: ${PAYWAY_API_KEY:}
    purchase-url: ${PAYWAY_PURCHASE_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase}
    check-url: ${PAYWAY_CHECK_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/check-transaction-2}
    callback-url: ${PAYWAY_CALLBACK_URL:}
    success-url: ${PAYWAY_SUCCESS_URL:http://localhost:5173/order}
    cancel-url: ${PAYWAY_CANCEL_URL:http://localhost:5173/place-order}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
    urls-primary-name: User API
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
