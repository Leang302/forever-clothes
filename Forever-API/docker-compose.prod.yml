services:
  postgres:
    image: postgres:16-alpine
    container_name: forever-postgres
    environment:
      POSTGRES_DB: forever
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: pgsty/minio:latest
    container_name: forever-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: forever-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    image: forever-api:latest
    container_name: forever-api
    ports:
      - "8989:8989"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/forever
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET}
      KHQR_ACCOUNT_ID: ${KHQR_ACCOUNT_ID}
      KHQR_MERCHANT_NAME: ${KHQR_MERCHANT_NAME}
      KHQR_MERCHANT_CITY: ${KHQR_MERCHANT_CITY}
      KHQR_API_TOKEN: ${KHQR_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
